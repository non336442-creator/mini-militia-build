name: Build Mini Militia Mod Menu

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'

    - name: Install NDK and Accept Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "build-tools;30.0.3" "platforms;android-30" > /dev/null

    - name: Build with Gradle
      run: |
        unzip -q "Mini Militia (3).zip"
        DIR=$(find . -name "gradlew" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
        cd "$DIR"
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Mod-Menu-APK
        path: |
          **/app/build/outputs/apk/release/*.apk
          **/app/build/outputs/apk/debug/*.apk
