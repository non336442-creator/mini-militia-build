name: Build Mini Militia Mod Menu

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        echo "y" | sdkmanager "ndk;21.4.7075529" "build-tools;30.0.3" "platforms;android-30"

    - name: Unzip project
      run: |
        unzip -q "Mini Militia (3).zip"

    - name: Find Project Directory
      id: find_dir
      run: |
        DIR=$(find . -name "build.gradle" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
        echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

    - name: Build with Gradle
      run: |
        cd ${{ env.PROJECT_DIR }}
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Mod-Menu-APK
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
